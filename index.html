<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>Video</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #000;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .player {
      width: min(100vw, 177.7778vh);
      aspect-ratio: 16 / 9;
      max-height: 100vh;
      background: #000;
    }
    .player iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>
<body>
  <main class="player" aria-label="YouTube動画">
    <iframe
      src="https://www.youtube-nocookie.com/embed/bzXtlZO9Lgw?autoplay=1&mute=1&playsinline=1&rel=0"
      title="YouTube video player"
      allow="autoplay; accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
      referrerpolicy="strict-origin-when-cross-origin"
      allowfullscreen>
    </iframe>
  </main>
</body>
</html>
